<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Controle Financeiro</h1>
      <label class="mes">Mês <input id="mes" type="month"></label>
    </header>

    <section class="resumo">
      <div><span>Receitas</span><strong id="receitas" class="positivo"></strong></div>
      <div><span>Despesas</span><strong id="despesas" class="negativo"></strong></div>
      <div><span>Saldo</span><strong id="saldo"></strong></div>
    </section>

    <form id="formulario" class="cartao">
      <h2>Novo lançamento</h2>
      <div class="grade">
        <label>Descrição <input id="descricao" placeholder="Ex.: Mercado" required></label>
        <label>Valor (R$) <input id="valor" type="number" step="0.01" min="0.01" required></label>
        <label>Tipo
          <select id="tipo">
            <option value="despesa">Despesa</option>
            <option value="receita">Receita</option>
          </select>
        </label>
        <label>Categoria <select id="categoria"></select></label>
        <label>Data <input id="data" type="date" required></label>
      </div>
      <button type="submit">Adicionar</button>
      <p id="erro" class="erro" hidden></p>
    </form>

    <section class="cartao">
      <h2>Despesas por categoria</h2>
      <div id="barras"></div>
      <p id="semDespesas" class="suave">Nenhuma despesa neste mês.</p>
    </section>

    <section class="cartao">
      <div class="titulo-linha">
        <h2>Lançamentos</h2>
        <button id="exportar" type="button" class="secundario">Exportar CSV</button>
      </div>
      <ul id="lista"></ul>
      <p id="vazio" class="suave">Nenhum lançamento neste mês.</p>
    </section>

    <footer>Os dados ficam salvos só neste navegador.</footer>
  </main>

  <script src="financas.js"></script>
  <script src="app.js"></script>
</body>
</html>
